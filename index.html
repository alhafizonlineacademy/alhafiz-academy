<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al HAFIZ Online Academy</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f8f9fa;
            color:#333;
            line-height:1.8;
        }

        header{
            background:#0B5E3C;
            color:white;
            padding:15px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            position:sticky;
            top:0;
            z-index:1000;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .logo img{
            width:60px;
            height:60px;
            border-radius:50%;
            background:white;
            padding:3px;
        }

        .logo h1{
            font-size:28px;
        }

        .logo p{
            font-size:14px;
            color:#d8f3dc;
        }

        nav ul{
            list-style:none;
            display:flex;
            gap:25px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        nav ul li a:hover{
            color:#FFD54F;
        }
    </style>
</head>

<body>

<header>

<div class="logo">

<img src="logo.png" alt="Al HAFIZ Online Academy Logo">

<div>
<h1>Al HAFIZ Online Academy</h1>
<p>Learn Quran Online with Tajweed & Authentic Islamic Education</p>
</div>

</div>

<nav>

<ul>

<li><a href="#">Home</a></li>

<li><a href="#">About</a></li>

<li><a href="#">Founder</a></li>

<li><a href="#">Courses</a></li>

<li><a href="#">Admission</a></li>

<li><a href="#">Contact</a></li>

</ul>

</nav>

</header>
